[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axioapi"
version = "1.0.0"
description = "Official Python SDK for the AxioAPI REST API: temp mail API, receive SMS and OTP API, email validation API, proxy API, SEO API (keyword data and backlink API), search API and social scraper APIs. One API key."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["api", "sdk", "seo api", "backlink api", "keyword api", "temp mail api", "sms verification api", "otp api", "email validation api", "proxy api", "scraper api", "search api", "serp api", "scholar api", "translation api", "python", "axioapi"]
dependencies = []

[project.urls]
Homepage = "https://axioapi.com"
Documentation = "https://axioapi.com/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
axioapi = ["operations.json"]
